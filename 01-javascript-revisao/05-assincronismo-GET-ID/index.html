<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - Busca Dinâmica</title>
</head>

<body>
    <!-- Campo para o usuário digitar o ID da postagem: -->
    <label for="idPostagem">Informe o ID da Postagem (1 a 100):</label>
    <input type="number" id="idPostagem" value="1" min="1" max="100">

    <button id="meuBotao">Buscar Postagem</button>
    <div id="container"></div>

    <script>
        const botao = document.querySelector("#meuBotao");
        const inputIdDaPostagem = document.querySelector("#idPostagem");
        const container = document.querySelector("#container");

        // Assincronismo com Async/Await e Manipulação do DOM
        botao.addEventListener("click", async () => {
            // Pegamos o valor atual digitado no input:
            const idDigitado = inputIdDaPostagem.value;

            // Validação simples: evita buscar se o campo estiver vazio:
            if (!idDigitado) {
                container.innerHTML = "<p>Por favor, insira um ID válido.</p>";
                return;
            }

            try {
                container.innerHTML = "<p>Carregando...</p>";

                // Usando Template String para injetar o ID dinamicamente na URL
                const resposta = await fetch(`https://jsonplaceholder.typicode.com/posts/${idDigitado}`);

                // Se a postagem não existir (ex: ID 999), a API retorna status 404:
                if (!resposta.ok) {
                    throw new Error("Postagem não encontrada. Verifique o ID e tente novamente.");
                }

                const postagem = await resposta.json();

                // Renderiza o post selecionado
                container.innerHTML = `
                    <div style="border: 1px solid #ccc; padding: 10px; margin-top: 10px;">
                        <h3>ID: ${postagem.id}</h3>
                        <p><b>Título:</b> ${postagem.title}</p>
                        <p><b>Conteúdo:</b> ${postagem.body}</p>
                    </div>
                `;
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                container.innerHTML = `<p style="color: red;">Erro: ${erro.message}</p>`;
            } finally {
                container.innerHTML += "<p><i>Requisição finalizada!</i></p>";
            }
        });
    </script>
</body>

</html>
