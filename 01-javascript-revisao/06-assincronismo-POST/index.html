<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - Enviar Dados (POST)</title>
</head>

<body>
    <!-- Campos para o usuário preencher os dados da nova postagem: -->
    <div style="margin-bottom: 15px;">
        <label for="idUsuario">ID do Usuário:</label><br>
        <input type="number" id="idUsuario" placeholder="Digite o ID do usuário" style="width: 300px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label for="tituloPostagem">Título da Postagem:</label><br>
        <input type="text" id="tituloPostagem" placeholder="Digite o título" style="width: 300px;">
    </div>

    <div style="margin-bottom: 15px;">
        <label for="conteudoPostagem">Conteúdo da Postagem:</label><br>
        <textarea id="conteudoPostagem" placeholder="Digite o conteúdo" style="width: 300px; height: 80px;"></textarea>
    </div>

    <button id="meuBotao">Cadastrar Postagem</button>
    <div id="container"></div>

    <script>
        const botao = document.querySelector("#meuBotao");
        const inputIdUsuario = document.querySelector("#idUsuario");
        const inputTitulo = document.querySelector("#tituloPostagem");
        const inputConteudo = document.querySelector("#conteudoPostagem");
        const container = document.querySelector("#container");

        // Assincronismo com Async/Await e Manipulação do DOM
        botao.addEventListener("click", async () => {
            const idUsuario = inputIdUsuario.value;
            const titulo = inputTitulo.value;
            const conteudo = inputConteudo.value;

            // Validação simples para não enviar campos vazios
            if (!idUsuario || !titulo || !conteudo) {
                container.innerHTML = "<p style='color: orange;'>Por favor, preencha todos os campos.</p>";
                return;
            }

            try {
                container.innerHTML = "<p>Enviando dados...</p>";

                // Configuração da requisição POST:
                const resposta = await fetch("https://jsonplaceholder.typicode.com/posts", {
                    method: "POST", // Define o método HTTP como POST.
                    headers: {
                        "Content-type": "application/json; charset=UTF-8" // Indica que estamos enviando JSON.
                    },
                    body: JSON.stringify({
                        userId: parseInt(idUsuario), 
                        title: titulo,
                        body: conteudo
                    })
                });

                if (!resposta.ok) {
                    throw new Error("Não foi possível salvar a postagem no servidor.");
                }

                // A API simula o salvamento e devolve o objeto criado com um novo ID (geralmente 101)
                const postagemCriada = await resposta.json();

                // Renderiza a confirmação do que foi cadastrado
                container.innerHTML = `
                    <div style="border: 1px solid green; padding: 10px; margin-top: 10px; background-color: #f4fff4;">
                        <h3 style="color: green;">✓ Sucesso! Postagem criada no servidor.</h3>
                        <p><b>ID gerado pelo servidor:</b> ${postagemCriada.id}</p>
                        <p><b>ID do Usuário:</b> ${postagemCriada.userId}</p>
                        <p><b>Título enviado:</b> ${postagemCriada.title}</p>
                        <p><b>Conteúdo enviado:</b> ${postagemCriada.body}</p>
                    </div>
                `;
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                container.innerHTML = `<p style="color: red;">Erro: ${erro.message}</p>`;
            } finally {
                container.innerHTML += "<p><i>Requisição finalizada!</i></p>";
            }
        });
    </script>
</body>

</html>
