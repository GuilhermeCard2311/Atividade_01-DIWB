<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - Busca com Query String</title>
</head>

<body>
    <!-- Campo alterado para buscar postagens de um usuário específico via Query String -->
    <label for="idUsuario">Filtrar postagens pelo ID do Usuário (1 a 10):</label>
    <input type="number" id="idUsuario" value="1" min="1" max="10">

    <button id="meuBotao">Buscar Postagens</button>
    <div id="container"></div>

    <script>
        const botao = document.querySelector("#meuBotao");
        const inputIdUsuario = document.querySelector("#idUsuario");
        const container = document.querySelector("#container");

        // Assincronismo com Async/Await e Manipulação do DOM
        botao.addEventListener("click", async () => {
            // Pegamos o valor atual digitado no input:
            const idDigitado = inputIdUsuario.value;

            // Validação simples: evita buscar se o campo estiver vazio:
            if (!idDigitado) {
                container.innerHTML = "<p>Por favor, insira um ID de usuário válido.</p>";
                return;
            }

            try {
                container.innerHTML = "<p>Carregando...</p>";

                // Usando Template String para injetar a Query String (?userId=...) após a rota principal
                const resposta = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${idDigitado}`);

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar as postagens. Tente novamente.");
                }

                // Atenção: O filtro por Query String nesta API sempre retorna um ARRAY (lista de postagens), mesmo que haja apenas uma postagem correspondente.
                const postagens = await resposta.json();

                // Se o array vier vazio, significa que nenhuma postagem corresponde àquele filtro
                if (postagens.length === 0) {
                    container.innerHTML = "<p>Nenhuma postagem encontrada para este usuário.</p>";
                    return;
                }

                // Mapeia o array de postagens recebido e injeta no HTML
                container.innerHTML = postagens.map(postagem => `
                    <div style="border: 1px solid #ccc; padding: 10px; margin-top: 10px; background-color: #f9f9f9;">
                        <h3>ID do Post: ${postagem.id} (Usuário: ${postagem.userId})</h3>
                        <p><b>Título:</b> ${postagem.title}</p>
                        <p><b>Conteúdo:</b> ${postagem.body}</p>
                    </div>
                `).join(''); // O .join('') remove as vírgulas geradas pelo map entre os blocos de HTML

            } catch (erro) {
                console.error("Erro na requisição:", erro);
                container.innerHTML = `<p style="color: red;">Erro: ${erro.message}</p>`;
            } finally {
                container.innerHTML += "<p><i>Requisição finalizada!</i></p>";
            }
        });
    </script>
</body>

</html>
